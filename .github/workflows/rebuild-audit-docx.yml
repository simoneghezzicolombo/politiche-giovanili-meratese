name: Rebuild audit docx

on:
  push:
    paths:
      - 'tmp/audit_docx_full/**'
      - '.github/workflows/rebuild-audit-docx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify DOCX
        shell: bash
        run: |
          cat \
            tmp/audit_docx_full/part00.b64 \
            tmp/audit_docx_full/part01.b64 \
            tmp/audit_docx_full/part02.b64 \
            tmp/audit_docx_full/part03a.b64 \
            tmp/audit_docx_full/part03b.b64 \
            tmp/audit_docx_full/part04.b64 \
            tmp/audit_docx_full/part05.b64 \
            tmp/audit_docx_full/part06a.b64 \
            tmp/audit_docx_full/part06b.b64 \
            tmp/audit_docx_full/part07.b64 \
            | base64 -d > docs/audit_spazi_giovani_meratese_2026.docx

          test "$(wc -c < docs/audit_spazi_giovani_meratese_2026.docx)" -eq 45695
          echo "1d7d0f49185dd7bc8493d6a787b9bb9aceb1d572845b206f37bb825da339a976  docs/audit_spazi_giovani_meratese_2026.docx" | sha256sum -c -
          unzip -t docs/audit_spazi_giovani_meratese_2026.docx

      - name: Commit verified DOCX
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit_spazi_giovani_meratese_2026.docx
          if git diff --cached --quiet; then
            echo "Verified DOCX already up to date"
            exit 0
          fi
          git commit -m "Add verified youth spaces audit document"
          git push

# Triggered after all verified base64 parts were staged.
