name: Materialize verified audit DOCX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-audit-docx.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and validate DOCX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs tmp/audit_spazi_giovani_docx
          OUT=tmp/audit_spazi_giovani_docx/full.b64
          : > "$OUT"
          append_blob() {
            curl -fsSL "https://api.github.com/repos/simoneghezzicolombo/politiche-giovanili-meratese/git/blobs/$1" \
              | jq -r '.content' | tr -d '\n' | base64 -d >> "$OUT"
          }
          append_blob 3f3db3fecb23da28929c66044d5e829dc2923637
          append_blob a0595100c0c3c87a23e98bb20aa13de5b085ea5d
          curl -fsSL 'https://raw.githubusercontent.com/simoneghezzicolombo/politiche-giovanili-meratese/c3a6585ffce3e47f3215c7368d8092e74bf1c8ec/tmp/audit_spazi_giovani_docx/part02.b64' >> "$OUT"
          append_blob ed6ddbe1076cd6547ca27de04f75f06349ce036a
          append_blob a8a856b729ace1a388ae3e3f32fe853f7e2e65fd
          append_blob 26d8ba5a485e86e1e3a14bdb6b5d94e512847032
          append_blob 6e911425dfe36203c400197c9de1c9b4d7b86b15
          append_blob 950467b86880d87672f822ea4114f520b43e0b16
          append_blob 49b76bfb1d09237ca6f1e491303e9871aeb4de10
          curl -fsSL 'https://raw.githubusercontent.com/simoneghezzicolombo/politiche-giovanili-meratese/3440b4d8fd039217b3dce7ce3adefeb40956b2d9/tmp/audit_spazi_giovani_docx/part06.b64' >> "$OUT"
          curl -fsSL 'https://raw.githubusercontent.com/simoneghezzicolombo/politiche-giovanili-meratese/52ab64d03c3b80a5178a05f891e0dbc53409d347/tmp/audit_spazi_giovani_docx/part07.b64' >> "$OUT"
          test "$(wc -c < "$OUT")" = "60928"
          base64 -d "$OUT" > docs/audit_spazi_giovani_meratese_2026.docx
          test "$(stat -c%s docs/audit_spazi_giovani_meratese_2026.docx)" = "45695"
          echo '1d7d0f49185dd7bc8493d6a787b9bb9aceb1d572845b206f37bb825da339a976  docs/audit_spazi_giovani_meratese_2026.docx' | sha256sum -c -
          unzip -t docs/audit_spazi_giovani_meratese_2026.docx >/dev/null
      - name: Clean staging and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/audit_spazi_giovani_docx
          rm .github/workflows/materialize-audit-docx.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add audit spazi giovani Meratese 2026'
          git push
