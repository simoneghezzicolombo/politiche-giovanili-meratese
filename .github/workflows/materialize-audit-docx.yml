name: Materialize audit DOCX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-audit-docx.yml'
      - 'tmp/audit_spazi_giovani_docx/**'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild DOCX
        run: |
          mkdir -p docs
          base64 -d tmp/audit_spazi_giovani_docx/part01.b64 > docs/audit_spazi_giovani_meratese_2026.docx
          unzip -t docs/audit_spazi_giovani_meratese_2026.docx >/dev/null
      - name: Clean staging files and commit
        run: |
          rm -rf tmp/audit_spazi_giovani_docx
          rm .github/workflows/materialize-audit-docx.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add audit spazi giovani Meratese 2026' || exit 0
          git push
