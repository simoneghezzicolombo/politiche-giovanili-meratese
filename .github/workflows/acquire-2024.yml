name: Acquire 2024 data

on:
  push:
    branches: [acquire-2024]
  workflow_dispatch:

jobs:
  openbdap-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and inspect official Lombardia Rendiconto 2024 archive
        run: |
          python - <<'PY'
          import urllib.request, pathlib, zipfile, io, csv
          out=pathlib.Path('openbdap_inspect'); out.mkdir(exist_ok=True)
          url='https://openbdap.rgs.mef.gov.it/Datasets_FET/Rendiconto/2024/2024_Rendiconto%20-%20Schemi%20di%20bilancio_LOMBARDIA.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=600) as r:
            data=r.read(); print('DOWNLOAD',r.status,r.headers.get('content-type'),'bytes',len(data),r.url)
          (out/'lombardia_rendiconto_2024.zip').write_bytes(data)
          z=zipfile.ZipFile(io.BytesIO(data))
          infos=z.infolist()
          print('ZIP files',len(infos))
          for info in infos:
            print(f'FILE\t{info.file_size}\t{info.filename}')
          print('\n--- tabular headers / first rows ---')
          for info in infos:
            low=info.filename.lower()
            if info.is_dir() or info.file_size==0: continue
            if not low.endswith(('.csv','.txt','.tsv')): continue
            raw=z.read(info)
            enc='utf-8-sig'
            try: text=raw.decode(enc)
            except UnicodeDecodeError:
              try: text=raw.decode('cp1252')
              except Exception: continue
            lines=text.splitlines()
            print(f'\nTABLE {info.filename} lines={len(lines)} bytes={len(raw)}')
            for line in lines[:4]: print(line[:2000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openbdap-lombardia-2024-inspect
          path: openbdap_inspect/
          retention-days: 7
