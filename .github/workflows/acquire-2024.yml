name: Acquire 2024 data

on:
  push:
    branches: [acquire-2024]
  workflow_dispatch:

jobs:
  openbdap-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: List official Lombardy Rendiconto 2024 files
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, pathlib, json
          out=pathlib.Path('openbdap_docs'); out.mkdir(exist_ok=True)
          params=urllib.parse.urlencode({'type':'Rendiconto','year':'2024','country':'Lombardia'})
          url='https://openbdap.rgs.mef.gov.it/fet/GetDocuments?'+params
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=180) as r:
            data=r.read(); print('STATUS',r.status,r.headers.get('content-type'),'bytes',len(data),'url',r.url)
          (out/'documents.json').write_bytes(data)
          obj=json.loads(data.decode('utf-8-sig'))
          print(json.dumps(obj,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openbdap-lombardia-documents
          path: openbdap_docs/
