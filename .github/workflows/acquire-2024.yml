name: Acquire 2024 data

on:
  push:
    branches: [acquire-2024]
  workflow_dispatch:

jobs:
  openbdap-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact OpenBDAP Analizza client
        run: |
          python - <<'PY'
          import urllib.request, pathlib, re
          out=pathlib.Path('openbdap_target'); out.mkdir(exist_ok=True)
          url='https://openbdap.rgs.mef.gov.it/Content/js/fet_analizza.js?v=639196472800000000'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=180) as r:
            data=r.read()
          text=data.decode('utf-8-sig',errors='replace')
          (out/'fet_analizza.js').write_text(text,encoding='utf-8')
          print(text)
          print('\n--- API-like strings ---')
          for x in sorted(set(re.findall(r'[A-Za-z0-9_./?=&+:-]*(?:GetFET|FETDocuments|api/fet|document)[A-Za-z0-9_./?=&+:-]*',text,re.I))):
            print(x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openbdap-target-js
          path: openbdap_target/
