name: Acquire 2024 data

on:
  push:
    branches: [acquire-2024]
  workflow_dispatch:

jobs:
  istat-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query ISTAT sample for Merate
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, pathlib, csv, io
          out=pathlib.Path('acquisition_probe'); out.mkdir(exist_ok=True)
          ages='+'.join([f'Y{i}' for i in range(15,30)]+['TOTAL'])
          key=f'A.097048.JAN.9.{ages}.99'
          url=f'https://esploradati.istat.it/SDMXWS/rest/data/IT1,22_289_DF_DCIS_POPRES1_24,1.0/{key}'
          req=urllib.request.Request(url, headers={
            'Accept':'application/vnd.sdmx.data+csv;version=1.0.0',
            'User-Agent':'Mozilla/5.0'
          })
          try:
            with urllib.request.urlopen(req, timeout=240) as r:
              data=r.read(); status=r.status; ctype=r.headers.get('content-type')
          except urllib.error.HTTPError as e:
            data=e.read(); status=e.code; ctype=e.headers.get('content-type')
          (out/'istat_merate_sample.csv').write_bytes(data)
          print('STATUS',status,ctype,'bytes',len(data),'url',url)
          text=data.decode('utf-8-sig',errors='replace')
          print('\n'.join(text.splitlines()[:10]))
          if status < 400:
            rows=list(csv.DictReader(io.StringIO(text)))
            print('rows',len(rows),'columns',list(rows[0]) if rows else [])
            rows2024=[r for r in rows if r.get('TIME_PERIOD')=='2024']
            print('2024 rows',len(rows2024))
            for r in rows2024: print(r)
          if status >= 400: raise SystemExit(status)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: istat-merate-sample
          path: acquisition_probe/
