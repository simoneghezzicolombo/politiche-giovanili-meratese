name: Render socialita figures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'analisi/socialita/render_socialita.py'
      - 'analisi/socialita/data/indicatori_socialita_lombardia_14_17_2013_2024.csv'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render figures
        run: python analisi/socialita/render_socialita.py

      - name: Commit rendered figures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analisi/socialita/figures/
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da committare.'
          else
            git commit -m 'Render socialita figures'
            git push origin main
          fi
