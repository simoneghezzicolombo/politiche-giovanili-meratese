name: Build official 2024 data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-data.yml'
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'

concurrency:
  group: build-official-2024
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download official OpenBDAP 2024 Lombardia rendiconto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw data/interim data/processed outputs/figures outputs/tables metadata
          URL='https://openbdap.rgs.mef.gov.it/Datasets_FET/rendiconto/2024/2024_Rendiconto%20-%20Schemi%20di%20bilancio_LOMBARDIA.zip'
          curl --fail --location --retry 3 --retry-delay 2 "$URL" -o data/raw/openbdap_rendiconto_2024_lombardia.zip
          test -s data/raw/openbdap_rendiconto_2024_lombardia.zip
          echo "OpenBDAP bytes: $(wc -c < data/raw/openbdap_rendiconto_2024_lombardia.zip)"
          unzip -tq data/raw/openbdap_rendiconto_2024_lombardia.zip

      - name: Parse OpenBDAP
        run: python scripts/01_openbdap.py --input data/raw/openbdap_rendiconto_2024_lombardia.zip

      - name: Download and parse Istat population
        run: python scripts/02_istat_population.py --year 2024

      - name: Build Meratese and Lombardia datasets
        run: |
          python scripts/03_build_dataset.py
          python scripts/03b_build_lombardia.py
          python scripts/04_benchmark.py --input data/processed/lombardia_2024.csv
          python scripts/05_audit_low_values.py
          python scripts/06_figures.py

      - name: Sanity checks
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          m = pd.read_csv('data/processed/meratese_2024.csv')
          l = pd.read_csv('data/processed/lombardia_2024.csv')
          assert len(m) == 24, f'Attesi 24 Comuni, trovati {len(m)}'
          assert m['comune'].nunique() == 24, 'Nomi Comune duplicati'
          assert m['dato_bilancio_mancante'].sum() == 0, 'Dati di bilancio mancanti'
          assert m['dato_popolazione_mancante'].sum() == 0, 'Dati demografici mancanti'
          assert (m['pop_15_29'] > 0).all(), 'Popolazione 15-29 non valida'
          assert 1450 <= len(l) <= 1550, f'Numero Comuni lombardi inatteso: {len(l)}'
          assert l['pop_totale'].notna().sum() >= 1450, 'Troppi match Istat mancanti in Lombardia'
          print('MERATESE')
          print(m[['comune','m0602_corrente_impegni','m0602_capitale_impegni','pop_15_29','eur_m0602_per_giovane_15_29']].to_string(index=False))
          print('\nLOMBARDIA')
          print(f"Enti comunali: {len(l)}; zero M06-P02: {int(l['m0602_zero'].sum())} ({l['m0602_zero'].mean()*100:.1f}%)")
          PY

      - name: Record sources
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('metadata/source_log.csv')
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          rows = pd.DataFrame([
              {
                  'entity':'Lombardia - Comuni','year':2024,
                  'variable':'rendiconto armonizzato; M06-P02 e spesa corrente',
                  'source_type':'OpenBDAP/RGS',
                  'source_url':'https://openbdap.rgs.mef.gov.it/Datasets_FET/rendiconto/2024/2024_Rendiconto%20-%20Schemi%20di%20bilancio_LOMBARDIA.zip',
                  'retrieved_at':now,'status':'acquisito','notes':'File ufficiale usato dalla pipeline'
              },
              {
                  'entity':'Comuni italiani','year':2024,
                  'variable':'popolazione residente totale e 15-29 anni',
                  'source_type':'Istat POSAS',
                  'source_url':'https://demo.istat.it/data/posas/POSAS_2024_it_Comuni.zip',
                  'retrieved_at':now,'status':'acquisito','notes':'Popolazione al 1 gennaio 2024'
              },
          ])
          if p.exists() and p.stat().st_size:
              old = pd.read_csv(p)
              all_rows = pd.concat([old, rows], ignore_index=True)
          else:
              all_rows = rows
          key = ['entity','year','variable','source_type','source_url']
          all_rows = all_rows.drop_duplicates(key, keep='last')
          all_rows.to_csv(p, index=False)
          PY

      - name: Upload reproducible outputs
        uses: actions/upload-artifact@v4
        with:
          name: meratese-2024-data
          if-no-files-found: error
          path: |
            data/interim/*.csv
            data/interim/*.txt
            data/processed/*.csv
            metadata/audit_queue_2024.csv
            metadata/source_log.csv
            outputs/tables/*.csv
            outputs/figures/*.png

      - name: Commit validated derived outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/meratese_2024.csv data/processed/lombardia_2024.csv metadata/audit_queue_2024.csv metadata/source_log.csv outputs/tables/benchmark_lombardia_2024.csv outputs/figures/euro_per_giovane_2024.png
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da committare.'
          else
            git commit -m 'Build official Meratese and Lombardia 2024 data'
            git push origin main
          fi
